
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Babi ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 600px;
    text-align: center;
}

svg {
    width: 100%;
    height: auto;
    overflow: visible;
}

.heart-text {
    fill: #ff80bd;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    filter: drop-shadow(0 0 5px #ff1493)
            drop-shadow(0 0 10px #ff69b4);
}

.heart-center {
    fill: #ff8fc9;
    font-size: 42px;
    font-weight: bold;
    text-anchor: middle;
    filter: drop-shadow(0 0 8px #ff1493);
    animation: pulse 1.5s infinite alternate;
}

@keyframes pulse {
    from {
        opacity: 0.7;
        transform: scale(0.98);
    }
    to {
        opacity: 1;
        transform: scale(1.05);
    }
}

svg {
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from {
        filter: drop-shadow(0 0 5px #ff1493);
    }
    to {
        filter: drop-shadow(0 0 20px #ff69b4);
    }
}

.message {
    color: #ff80bd;
    font-size: 16px;
    margin-top: 20px;
    letter-spacing: 3px;
}
</style>
</head>

<body>

<div class="container">

<svg viewBox="0 0 600 600">

    <defs>
        <path id="heartPath"
        d="M300 520
        C250 480 80 350 80 205
        C80 80 230 55 300 175
        C370 55 520 80 520 205
        C520 350 350 480 300 520Z"/>
    </defs>

    
    <text class="heart-text">
        <textPath href="#heartPath">
            I love you ♥ I love you ♥ I love you ♥
            I love you ♥ I love you ♥ I love you ♥
            I love you ♥ I love you ♥ I love you ♥
            I love you ♥ I love you ♥ I love you ♥
            I love you ♥ I love you ♥ I love you ♥
            I love you ♥ I love you ♥ I love you ♥
            I love you ♥ I love you ♥ I love you ♥
        </textPath>
    </text>

    
    <text class="heart-text" opacity="0.8">
        <textPath href="#heartPath" startOffset="2%">
            I love you ♥ I love you ♥ I love you ♥
            I love you ♥ I love you ♥ I love you ♥
            I love you ♥ I love you ♥ I love you ♥
        </textPath>
    </text>

    
    <text x="300" y="300" class="heart-center">
        SORRY BABI
    </text>

</svg>

<div class="message">
    I'M SORRY ❤️
</div>

</div>

</body>
</html>
